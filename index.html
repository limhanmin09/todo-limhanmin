<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <!-- 픽셀 글꼴: 영어는 Press Start 2P, 한글은 갈무리 (인터넷이 없으면 기본 글꼴로 보여요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2/dist/galmuri.css">
  <link rel="stylesheet" href="style.css">
  <!-- 시간대(아침/낮/저녁/밤)와 계절을 화면이 그려지기 전에 정해요 -->
  <script>
    (function () {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMonth() + 1;
      document.documentElement.dataset.theme =
        h >= 6 && h < 10 ? "morning" : h >= 10 && h < 17 ? "day" : h >= 17 && h < 20 ? "evening" : "night";
      document.documentElement.dataset.season =
        m >= 3 && m <= 5 ? "spring" : m >= 6 && m <= 8 ? "summer" : m >= 9 && m <= 11 ? "autumn" : "winter";
    })();
  </script>
</head>
<body>
  <!-- 픽셀 게임 배경: 해/달, 구름/별, 땅 + 카드 뒤 큰 글씨 -->
  <div class="backdrop" aria-hidden="true">
    <div id="stars" class="stars"></div>
    <div class="sky-light"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4 extra"></div>
    <div class="cloud c5 extra"></div>
    <p class="jesus">JESUS<span>loves you</span></p>
    <!-- 계절·날씨 효과 (벚꽃잎, 낙엽, 눈, 비, 반딧불) -->
    <canvas id="weather" class="weather"></canvas>
    <div class="ground"></div>
    <!-- 땅에 있는 픽셀 연못 (인택 이스터에그에서 낚시하는 곳) -->
    <div id="pond" class="pond"><i></i><i></i><i></i></div>
  </div>

  <!-- 땅 위를 지나가는 픽셀 친구들 (건드리면 깜짝 놀라요) -->
  <div id="critters" class="critters" aria-hidden="true"></div>

  <main class="app">
    <h1>할 일 목록</h1>
    <p class="subtitle">임한민의 할 일</p>

    <!-- 가장 가까운 할 일 (마감일 있는 할 일이 있을 때만 보여요) -->
    <p id="nearest" class="nearest" hidden></p>

    <form id="new-todo-form" class="new-todo">
      <div class="row">
        <input id="new-todo" type="text" placeholder="할 일을 입력하세요" autocomplete="off" autofocus>
        <button type="submit">추가</button>
      </div>
      <div class="row due">
        <label>마감일 <input id="new-date" type="date"></label>
        <label>시간 <input id="new-time" type="time"></label>
        <label>작성자 <input id="new-author" type="text" placeholder="안 적어도 돼요" autocomplete="off"></label>
      </div>
    </form>

    <!-- 할 일이 하나도 없을 때 보이는 문구 -->
    <p id="empty" class="empty"></p>

    <!-- 전체 / 진행 중 / 완료 버튼 + 남은 개수 (할 일이 있을 때만 보여요) -->
    <div id="filter-bar" class="filter-bar" hidden>
      <div class="filters">
        <button type="button" data-filter="all" class="selected">전체</button>
        <button type="button" data-filter="active">진행 중</button>
        <button type="button" data-filter="done">완료</button>
      </div>
      <span id="remaining" class="remaining"></span>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <!-- 고른 버튼에 해당하는 할 일이 없을 때 안내 -->
    <p id="filter-empty" class="filter-empty" hidden></p>
  </main>

  <!-- 카드 아래에 항상 보이는 작은 문구 -->
  <p id="footer-quote" class="footer-quote"></p>

  <!-- 이스터에그: 할 일에 "진수"를 적으면 오른쪽 위에 코 버튼이 생겨요 -->
  <button id="nose-btn" class="nose-btn" type="button" title="눌러 봐" hidden>👃</button>

  <script src="app.js"></script>
</body>
</html>
